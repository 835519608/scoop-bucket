# 定时跑 checkver，自动更新 bucket 里所有 manifest 的版本与 hash
# 参考: https://github.com/ScoopInstaller/GithubActions
name: Excavator

on:
  schedule:
    - cron: '0 21 * * *' # 每天 21:00 UTC = 北京时间次日 05:00
  workflow_dispatch:

jobs:
  excavate:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Excavator
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'
      # 必须带 token：否则 GitHub releases/latest 走匿名配额，偶发 403 把整 job 标红
      # （Excavator 本身已能 push 新版本；此步只校验 checkver 规则仍可用）
      - name: Validate checkver rules
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\.github\scripts\assert-checkver.ps1
