# 同版本 CDN 换包时 Excavator 不会动 hash；定时用 checkhashes -Update 纠偏。
name: Hash Refresh

on:
  schedule:
    # 每 8 小时；与 Excavator（21:00 UTC）错开
    - cron: '0 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh CDN hashes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser RemoteSigned -Force
          Invoke-RestMethod get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\scoop\shims"

      - name: Refresh mismatched hashes
        shell: pwsh
        run: .\.github\scripts\refresh-hashes.ps1

      - name: Commit and push
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/*.json
          if (git diff --cached --quiet) {
            Write-Host 'No hash changes to commit.'
            exit 0
          }
          $names = @(git diff --cached --name-only | ForEach-Object {
            [System.IO.Path]::GetFileNameWithoutExtension($_)
          })
          $msg = if ($names.Count -eq 1) {
            "$($names[0]): Fix hash"
          } else {
            "fix(hashes): refresh $($names -join ', ')"
          }
          git commit -m $msg
          git pull --rebase --autostash origin HEAD
          git push
